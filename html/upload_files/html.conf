http {
	client_max_body_size 50M;
	server {
		listen 0.0.0.0:8085;
		root ./html;
		index error502.html;

		location / {
			root ./html/static;
			index index.html;
		}
		
		#CGI locations
		location /python/ {
			root ./html/cgi_files/py;
			index capitalize.py;
			cgi_ext .py;
			cgi_path /usr/bin/python3;
		}
		
		location /php/ {
			root ./html/cgi_files/php;
			index check.php;
			cgi_ext .php;
			cgi_path /usr/bin/php-cgi;
		}

		location /upload/ {
			upload_store upload_files;
		}
	}
}
