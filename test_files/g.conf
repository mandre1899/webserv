## check for conflikting server address / server_names

http{
	client_header_buffer_size 1k;
   	client_header_timeout 30s;
	client_max_body_size 50M;
	client_body_timeout 30s;
	# root /data/serv1;
	# index index.html;
	# error_page 404  /404.html;
	# autoindex on;
	server{
        # Server configuration
		#listen 8080;
		server_name localhost;
        server_name asjdf;
        server_name dddd;
		autoindex off;
		root /data/serv1;
		index index.html;
    }
	server {
        # Server configuration
		listen 127.0.0.1:8085;
		root /data/serv1;
		location /images/ {
        	root /data/serv2;
			return 404;
			error_page 404     /404.html;
		}
		location /images/ {
			return 503;
		}

	}
}