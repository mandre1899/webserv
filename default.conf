#https://nginx.org/en/docs/http/ngx_http_core_module.html#client_body_timeout
#nginx: [emerg] invalid value "asdf" in "autoindex" directive, it must be "on" or "off" in /etc/nginx/http.d/vhost.conf:10
http {
	client_header_buffer_size 1k;
   	client_header_timeout 50s;
	client_max_body_size 50M;
	client_body_timeout 7s;

	server {
		listen 0.0.0.0:8081;
		autoindex off;
		root ./html/static;
		index index.html;
		location / {
		allow_methods GET POST DELETE;
		}
    }

	server {
		listen 8082;
		autoindex on;
		root ./html/directory;
		location /
		{
			autoindex on;
		}
		location /wrong/url {
    		return 444;
		}
		location /permanently/moved/url {
			return 301 http://www.example.com/moved/here;
		}
    }

	server {
		client_header_buffer_size 1k;
	   	client_header_timeout 1s;
		client_max_body_size 1M;
		client_body_timeout 2s;

		listen 0.0.0.0:8083;
		autoindex on;
		root ./html/;
		location /upload/ {
        	upload_store ./html/upload;
			allow_methods GET POST DELETE;
			error_page 404 501     /error.html;
			error_page 502     /error502.html;
    	}
    }

	server {
		listen 127.0.0.1:8084;
		server_name localhost;

		location /cgi-php/ {
			root ./html/cgi_files/php;
			cgi_path /usr/bin/php-cgi;
			index index.php;
		}

		location /cgi-py/ {
			root ./html/cgi_files/py/;
			cgi_path /usr/bin/python3;
			index test.py;
		}
	}

	server {
		listen 0.0.0.0:8085;
		autoindex on;
		root ./html/static;
		index index.html;
		location / 
		{
			allow_methods ; # block all methods
		}
    }

	server {
		listen 8086;
		server_name example.com beispiel.com;
		root /;
		index README.md;
	}
}

