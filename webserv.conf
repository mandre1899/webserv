#https://nginx.org/en/docs/http/ngx_http_core_module.html#client_body_timeout
http {
	client_body_buffer_size 8k
	 client_max_body_size 50M;

    server {
        # Server configuration
		listen 8080;
		#listen 127.0.0.1:8080;
    	#listen [::]:8080;
		server_name example.org;
		autoindex off;
		root /data/serv1
		index index.html

    }
	server {
        # Server configuration
		listen 127.0.0.1:8085;
    	#listen [::]:8080;
		server_name www.example.org;

		location /images/ {
        	root /data/serv2;
			limit_except GET POST {
				deny  all;
			}
    	}
		#In the example above, in response to a request for /images/example.png, NGINX Plus delivers the file /data/images/example.png.
		
		location /wrong/url {
    		return 404;
		}
		location /permanently/moved/url {
			return 301 http://www.example.com/moved/here;
		}
		#The first parameter of return is a response code. The optional second parameter can be the URL of a redirect (for codes 301, 302, 303, and 307) or the text to return in the response body.
    }
}