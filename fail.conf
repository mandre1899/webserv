http {
	client_header_buffer_size 1k;
   	client_header_timeout 50s;
	client_max_body_size 50M;

	server {
		listen 0.0.0.0:8081;
		autoindex off;
		root ./html/static;
		index index.html;
		location / {
		allow_methods GET POST DELETE;
		}
    }

