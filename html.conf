http {
	client_max_body_size 50M;
	server {
		listen 0.0.0.0:8085;
		root ./html;
		index error502.html;

		location / {
			root ./html/static;
			index index.html;
		}
		
		#CGI locations
		location /python/ {
			root ./html/cgi_files/py;
			index capitalize.py;
			cgi_ext .py;
			cgi_path /usr/bin/python3;
		}
		
		location /php/ {
			root ./html/cgi_files/php;
			index check.php;
			cgi_ext .php;
			cgi_path /usr/bin/php-cgi;
		}

		location /upload/ {
			upload_store upload_files;
		}

		location /redirect-to-youtube {
			return 301 https://www.youtube.com/watch?v=yqEeP1acj4Y;
		}
		location /redirect-loop
		{
			return 301 http://localhost:8085/redirect-loop-1;
		}

		location /redirect-loop-1
		{
			return 301 http://localhost:8085/redirect-loop;
		}

		location /200
		{
			return 200;
		}

		location /400
		{
			return 400;
		}

		location /403
		{
			return 403;
		}

		location /404
		{
			return 404;
		}

		location /500
		{
			return 500;
		}
	}
}
