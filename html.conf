http {
	server {
		listen 0.0.0.0:8085;
		root ./html;

		location / {
			index index.html;
		}

		location /submit {
			return 301 /;
		}

		location /upload {
			return 301 /;
		}

		location /redirect {
			return 301 http://youtube.com;
		}

		location /cgi-py {
			cgi_path /usr/bin/python3;
			root ./html/cgi;
			index test.py;
		}

		location /cgi-php {
			cgi_path /usr/bin/php-cgi;
			root ./html/cgi;
			index test2.php;
		}
	}
}

